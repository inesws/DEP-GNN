# DEP-GNN/model_configs/baseline_gcn.yaml

# Model architecture
hidden_dim: [128] 
num_layers: [3]
dropout: [0.7] #[0.5, 0.7] #

# Optimization
lr: [1e-3] #[1e-4, 1e-3, 5e-3]
weight_decay: [1e-3] #[1e-4, 1e-3, 1e-2]
batch_size: [32]

# Training
epochs: [200] #200
patience: [20]

# Graph convolution
use_edge_weight: [true]

